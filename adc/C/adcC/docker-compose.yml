services:
  adcc-debug:
    build:
      context: .
      dockerfile: Dockerfile.debug
    image: ${LOCAL_REGISTRY}:5002/adcc-debug:${TAG}
    ports:
      - ${DEBUG_SSH_PORT}:${DEBUG_SSH_PORT}
    volumes:
    - type: bind
      source: /dev/verdin-adc1
      target: /dev/verdin-adc1
    

  adcc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_LOGIN}/adcc:${TAG}
    volumes:
    - type: bind
      source: /dev/verdin-adc1
      target: /dev/verdin-adc1
    